version: 2

# Declares the Phase 1/5 Postgres tables as dbt sources rather than
# hardcoding table names in models. Schema here must track sql/*.sql
# exactly -- see sql/001_raw_telemetry.sql, sql/002_add_processed_at.sql,
# sql/003_extraction_log.sql, sql/004_add_collector_id.sql.

sources:
  - name: flightpulse
    schema: public
    tables:
      - name: raw_telemetry
        description: >
          Source-oriented landing table. One row per normalized telemetry
          event as written by worker/persistence.py. Flight-measurement
          fields (lat/lon, altitude, velocity, etc.) live inside the
          `payload` JSONB column by design -- typing them out is
          stg_opensky_states's job (continuation doc section 3, Load:
          "keep source-oriented storage separate from analytics models").
        columns:
          - name: ingestion_id
            description: Deterministic uuid5(source, icao24, last_contact). Unique per real-world observation.
            data_tests:
              - unique
              - not_null
          - name: icao24
            data_tests:
              - not_null
          - name: source
          - name: collector_id
          - name: payload
            data_tests:
              - not_null
          - name: received_at
            description: Row insert time (DB-assigned).
          - name: ingested_at
            description: Collector-assigned event time.
          - name: processed_at
            description: Time the worker actually persisted the row. Used for freshness/latency KPIs.

      - name: extraction_log
        description: >
          One row per collector poll cycle (not per event). Covers both
          success and failure cycles. Feeds mart_telemetry_quality.
        columns:
          - name: request_id
            data_tests:
              - unique
              - not_null
          - name: source
            data_tests:
              - not_null
          - name: collector_id
          - name: collector_version
          - name: request_scope
          - name: extraction_started_at
            data_tests:
              - not_null
          - name: extraction_completed_at
          - name: source_observation_time
          - name: record_count
          - name: success
            data_tests:
              - not_null
          - name: error_message
          - name: logged_at
