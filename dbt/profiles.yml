# FlightPulse dbt connection profile.
# Reuses the same POSTGRES_* env vars as .env.example (Phase 1) rather than
# introducing separate dbt-specific credentials.
#
# Usage: dbt run --profiles-dir dbt --project-dir dbt
# (or set DBT_PROFILES_DIR=dbt so you can drop --profiles-dir each time)

flightpulse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'flightpulse') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'flightpulse') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'flightpulse') }}"
      schema: public
      threads: 4
